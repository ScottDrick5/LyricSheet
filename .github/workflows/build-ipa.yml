name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: bash build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LyricSheet-ipa
          path: LyricSheet.ipa
