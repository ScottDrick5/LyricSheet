name: Build Mac app
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Lyric Sheet.app
        working-directory: desktop
        run: |
          mkdir -p app
          cp ../www/index.html ../www/rhymes.js app/
          perl -pi -e "s/__LYRIC_VERSION__/dev/g; s/__LYRIC_BUILT__/$(date -u +%Y-%m-%d)/g" app/index.html
          npm ci
          npx electron-builder --mac dir --universal
          APP="$(ls -d dist/mac-universal/*.app | head -1)"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../LyricSheet-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LyricSheet-mac
          path: LyricSheet-mac.zip
