<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audio Grabber: Allow microphone</title>
  <style>
    body { background: #16161b; color: #ececf1; font: 15px/1.5 system-ui, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 16px; }
    button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: #6aa8ff; color: #0d1b2e; font-weight: 600; cursor: pointer; }
    #status { margin-top: 16px; color: #8d8d9a; }
  </style>
</head>
<body>
  <h1>Allow microphone</h1>
  <p>Chrome needs you to grant microphone access to the extension once. After that, turn on
     <b>Mix in microphone</b> in the popup and your mic is recorded along with the tab.</p>
  <button id="allow">Allow microphone</button>
  <div id="status"></div>
  <script src="mic.js"></script>
</body>
</html>
