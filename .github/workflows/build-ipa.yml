name: Build unsigned IPA
on:
  workflow_dispatch:
  # main is built by the Release workflow, so only other branches get these test builds
  push:
    branches-ignore: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: bash build-ipa.sh
      # archive: false uploads the .ipa as-is instead of wrapping it in a zip
      - uses: actions/upload-artifact@v7
        with:
          path: LyricSheet.ipa
          archive: false
